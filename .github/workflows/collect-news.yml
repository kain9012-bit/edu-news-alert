name: Collect education press releases

on:
  workflow_dispatch:
  schedule:
    # UTC Sun-Thu 21:05 = KST Mon-Fri 06:05
    - cron: "5 21 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect press releases
        env:
          RETENTION_DAYS: "90"
          BRIEFING_HOUR_KST: "6"
          MAX_ITEMS_TOTAL: "5000"
          MAX_ITEMS_PER_SOURCE: "20"
        run: python crawler/collect.py

      - name: Collect press coverage of our releases
        continue-on-error: true
        run: |
          timeout 900 python crawler/collect_coverage.py \
            --days 45 --max-items 62 --out public/coverage.json

      # 구글 뉴스 RSS가 놓친 기사를 Gemini 구글 검색 연동으로 보완한다.
      # 모든 보도자료에 동일하게 적용하고(비교 왜곡 방지), 자료당 한 번만 검색한다.
      # 검색 연동은 월 5,000회까지 무료이며 사용량은 그 2% 수준이다.
      - name: Supplement coverage with AI web search
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          timeout 900 python crawler/ai_coverage_search.py \
            --coverage public/coverage.json --max-calls 25

      - name: Select and classify education trends
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-3.1-flash-lite
        run: python -m harness.run

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update press releases and AI selection"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
