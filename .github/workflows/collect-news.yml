name: Collect education press releases

on:
  workflow_dispatch:
  schedule:
    # GitHub 예약 실행은 지연·누락이 잦아 여러 시각에 걸어두고, 이미 끝났으면 건너뛴다.
    # KST 06:05 / 06:50 / 07:40 (UTC 21:05 / 21:50 / 22:40, 일~목)
    - cron: "5 21 * * 0-4"
    - cron: "50 21 * * 0-4"
    - cron: "40 22 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 오늘 선별(briefing)이 이미 만들어졌으면 재시도 예약은 AI 단계를 건너뛴다.
      - name: Check if today already processed
        id: done
        run: |
          today="$(TZ=Asia/Seoul date +%F)"
          if [ -f "public/briefings/${today}.json" ]; then
            echo "briefing=true" >> "$GITHUB_OUTPUT"
            echo "오늘(${today}) 선별 결과가 이미 있습니다. AI 단계는 건너뜁니다."
          else
            echo "briefing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect press releases
        env:
          RETENTION_DAYS: "90"
          BRIEFING_HOUR_KST: "6"
          MAX_ITEMS_TOTAL: "5000"
          MAX_ITEMS_PER_SOURCE: "20"
        run: python crawler/collect.py

      - name: Collect press coverage of our releases
        if: steps.done.outputs.briefing != 'true'
        continue-on-error: true
        run: |
          timeout 900 python crawler/collect_coverage.py \
            --days 45 --max-items 62 --out public/coverage.json

      # 구글 뉴스 RSS가 놓친 기사를 Gemini 구글 검색 연동으로 보완한다.
      # 모든 보도자료에 동일하게 적용하고(비교 왜곡 방지), 자료당 한 번만 검색한다.
      # 검색 연동은 월 5,000회까지 무료이며 사용량은 그 2% 수준이다.
      - name: Supplement coverage with AI web search
        if: steps.done.outputs.briefing != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          timeout 900 python crawler/ai_coverage_search.py \
            --coverage public/coverage.json --max-calls 25

      - name: Select and classify education trends
        if: steps.done.outputs.briefing != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-3.1-flash-lite
        run: python -m harness.run

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update press releases and AI selection"
          # 실행 중 원격에 다른 커밋이 오면 rebase 후 재시도한다(충돌 시 이번 수집분 우선).
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 거절됨(${attempt}회) — 원격 변경분 위로 rebase 후 재시도"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "3회 재시도 후에도 push 실패"
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
