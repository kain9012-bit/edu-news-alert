name: Deploy Pages on push

# public/ 폴더가 바뀌면(수집 커밋, 지난 호 발행 등) GitHub Pages를 다시 배포한다.
# 이렇게 하면 비공개 보고서 워크플로가 public/reports/ 로 발행한 지난 호가 당일 바로 반영된다.

on:
  push:
    branches: [main]
    paths:
      - "public/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
